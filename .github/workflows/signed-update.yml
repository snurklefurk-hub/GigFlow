name: Publish signed Moonbeam update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - '.github/workflows/signed-update.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROR_SIGNING_KEYSTORE_BASE64: ${{ secrets.ROR_SIGNING_KEYSTORE_BASE64 }}
      ROR_STORE_PASSWORD: ${{ secrets.ROR_SIGNING_STORE_PASSWORD }}
      ROR_KEY_ALIAS: ${{ secrets.ROR_SIGNING_KEY_ALIAS }}
      ROR_KEY_PASSWORD: ${{ secrets.ROR_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require complete permanent signing key configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ROR_SIGNING_KEYSTORE_BASE64" && -z "$ROR_STORE_PASSWORD" && -z "$ROR_KEY_ALIAS" && -z "$ROR_KEY_PASSWORD" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '### No signed release: configure the four ROR_SIGNING_* secrets before installing this app.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for name in ROR_SIGNING_KEYSTORE_BASE64 ROR_STORE_PASSWORD ROR_KEY_ALIAS ROR_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Install JDK 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        if: steps.signing.outputs.configured == 'true'
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$SDK_ROOT/platforms/android-36/android.jar"

      - name: Install Gradle 9.1.0
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Decode keystore and set release version
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ROR_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ride-offer-reader-release.jks"
          chmod 600 "$RUNNER_TEMP/ride-offer-reader-release.jks"
          echo "ROR_KEYSTORE_PATH=$RUNNER_TEMP/ride-offer-reader-release.jks" >> "$GITHUB_ENV"
          echo "ROR_RELEASE_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ROR_RELEASE_NAME=0.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test and build permanently signed APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:assembleRelease -ProrVersionCode="$ROR_RELEASE_CODE" -ProrVersionName="$ROR_RELEASE_NAME" --stacktrace
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -Fq "package: name='app.rideofferreader.driver' versionCode='$ROR_RELEASE_CODE'" || {
            echo "::error::Signed APK has unexpected package name or version code"
            exit 1
          }
          mkdir -p out
          cp "$APK" out/Ride-Offer-Reader.apk
          echo "ROR_APK_SHA256=$(sha256sum out/Ride-Offer-Reader.apk | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish signed GitHub Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "ror-v$ROR_RELEASE_CODE" "out/Ride-Offer-Reader.apk#Ride-Offer-Reader.apk" \
            --target "$GITHUB_SHA" --title "Moonbeam by NightRider $ROR_RELEASE_NAME" \
            --notes "Moonbeam by NightRider signed in-app update.
          VersionCode: $ROR_RELEASE_CODE
          SHA256: $ROR_APK_SHA256"
          echo "### Published signed update $ROR_RELEASE_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ride-offer-reader-release.jks"
