name: Android signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build unsigned debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Decode signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > release.keystore
      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ORG_GRADLE_PROJECT_GIGFLOW_STORE_FILE: ${{ github.workspace }}/android/release.keystore
          ORG_GRADLE_PROJECT_GIGFLOW_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_GIGFLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_GIGFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gigflow-apk
          path: android/app/build/outputs/apk/**/*.apk
