name: Android prototype APK

on:
  push:
    branches: [ "mvp/uber-lyft-read-only" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.1.0 (required by Android Gradle Plugin 9.0)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Test and build debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ride-offer-reader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
